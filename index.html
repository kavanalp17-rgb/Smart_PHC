<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart PHC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <!-- Background overlay -->
        <div class="overlay"></div>

        <!-- Floating light particles -->
        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Main Content -->
        <section class="hero-content">

            <!-- Medical Symbol -->
            <div class="medical-icon">
                <div class="icon-circle">
                    <span class="cross-horizontal"></span>
                    <span class="cross-vertical"></span>
                </div>
            </div>

            <!-- App Name -->
            <h1 class="app-name">
                <span>S</span>
                <span>M</span>
                <span>A</span>
                <span>R</span>
                <span>T</span>
                <span class="space"></span>
                <span>P</span>
                <span>H</span>
                <span>C</span>
            </h1>

            <!-- Small line -->
            <div class="title-line"></div>

            <!-- Quote -->
            <p class="tagline">
                Smart Care. Connected Health.
            </p>


        </section>

    </main>
<script src="script.js"></script>
</body>
</html>
