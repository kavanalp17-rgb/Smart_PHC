<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart PHC - Staff Login</title>

    <link rel="stylesheet" href="staff-login.css">
</head>

<body>

    <div class="staff-page">

        <div class="staff-card">

            <!-- Medical Logo -->
            <div class="logo">
                <div class="logo-circle">
                    <span class="cross-horizontal"></span>
                    <span class="cross-vertical"></span>
                </div>
            </div>

            <h1>Welcome, <span>PHC Staff</span></h1>

            <p class="welcome-text">
                Login to manage PHC services and patient care.
            </p>

            <form>

                <!-- Email / Phone -->
                <div class="input-group">

                    <label>Email or Phone</label>

                    <input
                        type="text"
                        placeholder="Enter your email or phone"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="staffPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleStaffPassword"
                        >👁</button>

                    </div>

                </div>


                <!-- Forgot Password -->
                <div class="forgot-container">

                    <a
                        href="forgot.html"
                        class="forgot-link"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <!-- Message -->
                <div
                    id="staffMessage"
                    class="login-message"
                ></div>

            </form>


            <!-- Change Role -->
            <p class="role-text">

                Not PHC Staff?

                <a href="role-selection.html">
                    Change Role
                </a>

            </p>

        </div>

    </div>


    <script src="staff-login.js"></script>

</body>

</html>
